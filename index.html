<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mariam El-Atbany | Personal Portfolio</title>
<style>
:root {
  --bg: #f4f7fc;
  --card: #ffffff;
  --navy: #0b2545;
  --navy-2: #13315c;
  --text: #0b2545;
  --muted: #5b6b85;
  --btn-bg: #0b2545;
  --btn-text: #ffffff;
  --btn-hover: #1d4380;
  --shadow: 0 10px 30px rgba(11, 37, 69, .15);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060f1f;
    --card: #0d1b33;
    --text: #f2f6fc;
    --muted: #9fb0cc;
    --btn-bg: #f2f6fc;
    --btn-text: #0b2545;
    --btn-hover: #d5e1f5;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #060f1f; --card: #0d1b33; --text: #f2f6fc; --muted: #9fb0cc;
  --btn-bg: #f2f6fc; --btn-text: #0b2545; --btn-hover: #d5e1f5;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}
.card {
  width: 100%;
  max-width: 440px;
  background: var(--card);
  border-radius: 28px;
  box-shadow: var(--shadow);
  overflow: hidden;
  text-align: center;
}
.banner {
  height: 8px;
  background: linear-gradient(90deg, var(--navy), #2f6bd1);
}
.content { padding: 40px 24px 36px; }
.avatar {
  width: 84px; height: 84px;
  margin: 0 auto 20px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, #0b2545, #2f6bd1);
  color: #fff;
  font-size: 30px; font-weight: 700; letter-spacing: 1px;
}
h1 { margin: 0; font-size: 1.9rem; line-height: 1.2; font-weight: 700; }
.sub {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: .85rem;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.links { margin-top: 34px; display: grid; gap: 14px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 18px 20px;
  min-height: 64px;
  background: var(--btn-bg);
  color: var(--btn-text);
  text-decoration: none;
  font-size: 1.1rem; font-weight: 600;
  border-radius: 16px;
  transition: transform .15s ease, background .15s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover, .btn:focus-visible { background: var(--btn-hover); transform: translateY(-2px); }
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 3px solid #2f6bd1; outline-offset: 3px; }
.icon { font-size: 1.4rem; line-height: 1; }
@media (max-width: 380px) {
  h1 { font-size: 1.6rem; }
  .btn { font-size: 1rem; }
}
</style>
</head>
<body>
  <main class="card">
    <div class="banner"></div>
    <div class="content">
      <div class="avatar" aria-hidden="true">ME</div>
      <h1>Mariam El-Atbany</h1>
      <p class="sub">Personal Portfolio</p>
      <nav class="links">
        <a class="btn" href="https://drive.google.com/file/d/16dG9ce-j0-8BIuhOZJZ9jEq4UAa-InQ8/view?usp=sharing" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">📄</span>My CV</a>
        <a class="btn" href="https://www.linkedin.com/in/mariamelatbany/" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">💼</span>LinkedIn Profile</a>
        <a class="btn" href="https://drive.google.com/file/d/1Ind7ty1WOOgXuFgyMTnFoC9YyFfU06W_/view?usp=sharing" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">📊</span>Infographic</a>
      </nav>
    </div>
  </main>
</body>
</html>
